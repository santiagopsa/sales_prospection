<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Peaku · SDR Coach</title>
  <link rel="icon" type="image/png" href="/img/peaku-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sdr.css" />
</head>
<body>
  <header class="barra">
    <a class="marca" href="#/cola"><img src="/img/peaku-logo.png" alt="Peaku" /><span>SDR Coach</span></a>
    <nav>
      <a href="#/cola" data-r="cola">Cola del día</a>
      <a href="#/importar" data-r="importar">Cargar</a>
      <a href="#/pipeline" data-r="pipeline">Pipeline</a>
      <a href="#/marcar" data-r="marcar">Marcar</a>
      <a href="#/comision" data-r="comision">Comisión</a>
      <a href="#/historial" data-r="historial">Historial</a>
      <a href="#/semana" data-r="semana">Semana</a>
    </nav>
    <form class="buscador" id="buscador" autocomplete="off" role="search">
      <input id="buscar-q" type="search" placeholder="Buscar empresa, contacto, teléfono o correo" aria-label="Buscar lead" />
      <div id="buscar-resultados" class="buscar-resultados" hidden></div>
    </form>
    <select id="usuario" class="usuario" title="Quién está usando la app"></select>
  </header>
  <main id="app"><p class="vacio">Cargando…</p></main>
  <script src="https://unpkg.com/voximplant-websdk" defer></script>
  <script src="telefonia.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
