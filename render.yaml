services:
  - type: web
    name: peaku-sandler
    runtime: node
    plan: starter   # siempre despierto: webhooks de Voximplant y jobs del SDR no corren dormidos
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: peaku-sandler-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false   # setéala manualmente en Render → Environment

databases:
  - name: peaku-sandler-db
    plan: free      # TODO: subir desde la consola de Render (el plan free de Postgres expira); luego reflejarlo aquí
    databaseName: peaku_sandler
    user: peaku
